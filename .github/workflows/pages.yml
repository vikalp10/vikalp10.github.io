name: Build & publish terminal

# Regenerates docs/ from the Spring Boot app on every push to main, so the published
# site is always whatever PortfolioData.java currently says. Pages is configured as
# "Deploy from a branch → main → /docs", so committing docs/ back is the deploy.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'          # the bot's own commit — nothing to rebuild from
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B -ntp -DskipTests package

      - name: Render static site
        run: java -jar target/vklp-portfolio.jar --export

      - name: Commit docs/ if it changed
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "docs/ is already up to date — nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          # GITHUB_TOKEN pushes don't retrigger workflows; [skip ci] is belt and braces.
          git commit -m "chore: regenerate docs/ from Spring Boot export [skip ci]"
          git push
