spring.application.name=vklp-portfolio
server.port=8080

# Live-edit templates during local preview.
spring.thymeleaf.cache=false

# Where --export writes the static site. GitHub Pages is configured to serve this folder.
portfolio.export.dir=docs

# Keep the export log readable.
spring.main.banner-mode=off
logging.pattern.console=%clr(%-5level) %clr(%logger{0}){cyan} %msg%n
